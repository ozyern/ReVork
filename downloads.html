    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap');
        
        :root {
            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);

            --bg-color: #03050a;
            --text-main: #ffffff;
            --text-muted: #86868b;
            --text-sub: rgba(255, 255, 255, 0.6);
            
            --glass-bg: rgba(15, 20, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-border-hover: rgba(255, 255, 255, 0.25);
            --glass-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8);
            
            --title-gradient: linear-gradient(110deg, #9ca3af 0%, #ffffff 30%, #9ca3af 50%, #ffffff 70%, #9ca3af 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        ::selection {
            background: rgba(59, 130, 246, 0.3);
            color: #fff;
        }

        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            background-color: var(--bg-color);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        /* Ambient Background */
        .ambient-bg-wrapper {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -2;
            pointer-events: none;
            background-color: var(--bg-color);
        }
        
        .cyber-grid {
            position: absolute;
            inset: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(800px) rotateX(65deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 30s linear infinite;
            mask-image: radial-gradient(circle at center, black 5%, transparent 65%);
            -webkit-mask-image: radial-gradient(circle at center, black 5%, transparent 65%);
        }

        @keyframes gridMove {
            0% { transform: perspective(800px) rotateX(65deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(800px) rotateX(65deg) translateY(60px) translateZ(-200px); }
        }

        .ambient-bg {
            position: absolute;
            inset: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(20, 50, 100, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 70% 60%, rgba(10, 30, 70, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 55%);
            filter: blur(70px);
            animation: ambientPulse 18s ease-in-out infinite alternate;
        }

        @keyframes ambientPulse { 
            0% { transform: scale(1); opacity: 0.7; } 
            100% { transform: scale(1.05); opacity: 1; } 
        }

        /* Navigation Back Button */
        .nav-back-container {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 50;
        }

        @media (min-width: 640px) {
            .nav-back-container { top: 2rem; left: 2rem; }
        }
        
        .btn-back {
            display: flex;
            align-items: center;
            gap: 0.6rem; 
            padding: 0.75rem 1.25rem 0.75rem 1rem;
            border-radius: 999px;
            color: var(--text-main);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            background: rgba(20, 30, 45, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            transition: all 0.25s var(--ease-spring);
        }

        .btn-back:hover { 
            background: rgba(30, 45, 70, 0.7);
            border-color: var(--glass-border-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .btn-back svg {
            width: 1.25rem;
            height: 1.25rem;
            transition: transform 0.25s ease;
        }

        .btn-back:hover svg {
            transform: translateX(-3px);
        }

        /* Terminal Window */
        .terminal-container {
            width: 100%;
            max-width: 920px;
            z-index: 10;
        }
        
        .terminal-glow-wrapper { 
            position: relative;
            width: 100%;
            border-radius: 24px; 
            transition: box-shadow 0.4s ease; 
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.7); 
        }

        .terminal-glow-wrapper.is-ready {
            box-shadow: 0 0 80px rgba(59, 130, 246, 0.2) !important;
        }

        .terminal-window {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
        }

        /* Terminal Header */
        .terminal-header {
            display: flex;
            align-items: center;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px 24px 0 0;
            position: relative;
        }

        .mac-dots {
            display: flex;
            gap: 8px;
        }

        .mac-dot { 
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-red { background-color: #ff5f56; } 
        .dot-yel { background-color: #ffbd2e; } 
        .dot-grn { background-color: #27c93f; }
        
        .terminal-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        /* Dropdowns */
        .dropdown-container {
            position: relative;
            z-index: 100;
            padding: 1.5rem;
        }

        @media (min-width: 640px) {
            .dropdown-container { padding: 2rem 2.5rem; }
        } 

        .custom-dd-wrapper {
            position: relative;
            width: 100%;
        }
        .custom-dd-wrapper.is-active {
            z-index: 999 !important;
        }

        .custom-dd-btn {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 15, 25, 0.5);
            border: 1px solid var(--glass-border);
            padding: 1.1rem 1.25rem;
            border-radius: 14px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s var(--ease-smooth);
        }

        @media (min-width: 640px) {
            .custom-dd-btn { padding: 1.25rem 1.5rem; font-size: 0.95rem; border-radius: 16px; }
        }

        .custom-dd-btn:hover:not(.disabled) {
            background: rgba(25, 35, 55, 0.6);
            border-color: var(--glass-border-hover);
            transform: translateY(-2px);
        }

        .custom-dd-btn.disabled {
            opacity: 0.4;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.3);
        }

        .custom-dd-btn[aria-expanded="true"] {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.1);
        }

        .custom-dd-btn svg {
            transition: transform 0.25s ease;
        }

        .custom-dd-btn[aria-expanded="true"] svg {
            transform: rotate(180deg);
        }
        
        .custom-dd-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 100%;
            z-index: 1000;
            background: #090b10;
            border: 1px solid var(--glass-border-hover);
            border-radius: 16px;
            padding: 0.5rem;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-8px);
            transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.2s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .custom-dd-menu.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0);
        }
        
        .custom-dd-item { 
            padding: 0.85rem 1rem;
            border-radius: 10px;
            color: var(--text-muted); 
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        @media (min-width: 640px) {
            .custom-dd-item { font-size: 0.9rem; padding: 1rem 1.25rem; }
        }
        
        .custom-dd-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transform: translateX(4px);
        }

        /* Terminal Footer / CLI Output */
        .cli-footer {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(5, 5, 8, 0.7);
            border-top: 1px solid var(--glass-border);
            border-radius: 0 0 24px 24px;
            padding: 1.5rem;
        }

        @media (min-width: 640px) {
            .cli-footer { padding: 1.5rem 2.5rem; }
        }

        .term-glow-green { color: #34d399; }
        .term-glow-blue { color: #60a5fa; }
        .term-glow-white { color: #ffffff; }
        .term-glow-red { color: #f87171; }
        .term-glow-yellow { color: #fbbf24; }
        
        .block-cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: #fff;
            vertical-align: middle;
            margin-left: 4px;
        }

        /* Action Buttons */
        .btn-exec {
            background: #ffffff;
            color: #000;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            border-radius: 999px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
            transition: all 0.25s var(--ease-smooth);
            border: none;
            cursor: pointer;
        }
        
        .btn-exec.is-ready {
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
        }

        .btn-exec:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3);
        }

        .btn-exec:active {
            transform: scale(0.97);
        }

        .btn-rst {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            border-radius: 999px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-rst:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--glass-border-hover);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-rst:active {
            transform: scale(0.97);
        }

        /* Typography & Animation */
        .animate-gradient-text {
            background: var(--title-gradient);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 8s linear infinite;
        }

        @keyframes textShine {
            0% { background-position: 0% center; }
            100% { background-position: -200% center; }
        }

        .fade-in-up {
            opacity: 0;
            transform: translateY(16px);
            animation: fadeInUp 0.7s forwards var(--ease-smooth);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer Links */
        .footer-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            padding: 0.6rem 1.25rem;
            border-radius: 99px;
            color: var(--text-sub);
            text-decoration: none;
            border: 1px solid transparent;
            transition: all 0.25s ease;
        }

        .footer-btn:hover {
            color: #ffffff;
            background: var(--glass-bg);
            border-color: var(--glass-border);
        }
    </style>
</head>

    <script>
        // Terminal CLI typing output
        const cliOutput = document.getElementById('cli-output');
        let typeTimeout;

        function typeCommand(cmdText, colorClass = 'text-gray-400') {
            clearTimeout(typeTimeout);
            cliOutput.className = `font-medium truncate ml-1 ${colorClass}`;
            cliOutput.innerText = '';
            
            let i = 0;
            function typeChar() {
                if (i < cmdText.length) {
                    cliOutput.innerText += cmdText.charAt(i);
                    i++;
                    typeTimeout = setTimeout(typeChar, 15);
                }
            }
            typeChar();
        }

        // Initial shell greeting
        setTimeout(() => {
            typeCommand("init revork_shell... done. awaiting --hardware");
        }, 600);

        // State & Dropdown Management
        let state = { device: null, component: null, variant: null };
        const ddWrappers = document.querySelectorAll('.custom-dd-wrapper');
        const btnExec = document.getElementById('btn-resolve');
        const glowWrapper = document.getElementById('glow-wrapper');

        function checkReadyState() {
            if (state.device && state.component) {
                if (state.component === 'super_empty' || (state.component === 'recovery' && state.variant)) {
                    btnExec.classList.add('is-ready');
                    glowWrapper.classList.add('is-ready');
                    return;
                }
            }
            btnExec.classList.remove('is-ready');
            glowWrapper.classList.remove('is-ready');
        }

        function closeAllDropdowns() {
            document.querySelectorAll('.custom-dd-btn').forEach(b => b.setAttribute('aria-expanded', 'false'));
            document.querySelectorAll('.custom-dd-menu').forEach(m => m.classList.remove('show'));
            ddWrappers.forEach(w => w.classList.remove('is-active'));
        }

        ddWrappers.forEach((wrapper) => {
            const btn = wrapper.querySelector('.custom-dd-btn');
            const menu = wrapper.querySelector('.custom-dd-menu');
            const text = wrapper.querySelector('.dd-text');
            const type = wrapper.id.replace('dd-', '');

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (btn.classList.contains('disabled')) return;
                
                const isExpanded = btn.getAttribute('aria-expanded') === 'true';
                closeAllDropdowns();
                
                if (!isExpanded) {
                    wrapper.classList.add('is-active'); 
                    btn.setAttribute('aria-expanded', 'true');
                    menu.classList.add('show');
                }
            });

            menu.querySelectorAll('.custom-dd-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const val = item.getAttribute('data-val');
                    const label = item.textContent;
                    
                    text.textContent = label;
                    text.classList.remove('text-gray-500', 'text-gray-600');
                    text.style.color = '#fff';
                    state[type] = val;
                    
                    closeAllDropdowns();
                    handleLogicUpdate(type);
                });
            });
        });

        document.addEventListener('click', closeAllDropdowns);

        const btnComp = document.querySelector('#dd-component .custom-dd-btn');
        const textComp = document.querySelector('#dd-component .dd-text');
        const btnVar = document.querySelector('#dd-variant .custom-dd-btn');
        const textVar = document.querySelector('#dd-variant .dd-text');

        function handleLogicUpdate(triggeredBy) {
            if (triggeredBy === 'device') {
                btnComp.classList.remove('disabled');
                textComp.textContent = "Select Format...";
                textComp.style.color = "var(--text-muted)";
                state.component = null;
                
                btnVar.classList.add('disabled');
                textVar.textContent = "Locked";
                textVar.style.color = "var(--text-muted)";
                state.variant = null;
                
                typeCommand(`export TARGET="${state.device}"; awaiting --format`);
            }
            
            if (triggeredBy === 'component') {
                if (state.component === 'recovery') {
                    btnVar.classList.remove('disabled');
                    textVar.textContent = "Select Variant...";
                    textVar.style.color = "var(--text-muted)";
                    state.variant = null;
                    typeCommand(`export COMPONENT="recovery"; awaiting --variant`);
                } else if (state.component === 'super_empty') {
                    btnVar.classList.add('disabled');
                    textVar.textContent = "Standard Output";
                    textVar.style.color = "#ffffff";
                    state.variant = 'default';
                    typeCommand(`./resolve_link.sh --ready`, "term-glow-green");
                }
            }

            if (triggeredBy === 'variant') {
                typeCommand(`./resolve_link.sh --ready`, "term-glow-green");
            }
            checkReadyState();
        }

        document.getElementById('btn-reset').addEventListener('click', () => {
            state = { device: null, component: null, variant: null };
            
            const textDev = document.querySelector('#dd-device .dd-text');
            textDev.textContent = "Select Device...";
            textDev.style.color = "var(--text-main)";
            
            btnComp.classList.add('disabled');
            textComp.textContent = "Awaiting Hardware...";
            textComp.style.color = "var(--text-muted)";
            
            btnVar.classList.add('disabled');
            textVar.textContent = "Locked";
            textVar.style.color = "var(--text-muted)";
            
            typeCommand("clear && reset_env; awaiting --hardware");
            checkReadyState();
        });

        // Device Download Database
        const fileDatabase = {
            'op9pro': { 
                'super_empty': { default: 'https://github.com/ozyern/ReVork/releases/download/downloads/super_empty_9p.img' }, 
                'recovery': { 'orangefox': 'https://github.com/ozyern/ReVork/releases/download/downloads/orangefox_9series.img', 'twrp': 'https://github.com/ozyern/ReVork/releases/download/downloads/twrp_9series.img' }
            },
            'op9': { 
                'super_empty': { default: 'https://github.com/ozyern/ReVork/releases/download/downloads/super_empty_9.img' }, 
                'recovery': { 'orangefox': 'https://github.com/ozyern/ReVork/releases/download/downloads/orangefox_9series.img', 'twrp': 'https://github.com/ozyern/ReVork/releases/download/downloads/twrp_9series.img' }
            },
            'op8pro': { 
                'super_empty': { default: 'https://github.com/ozyern/ReVork/releases/download/downloads/super_empty_8p.img' }, 
                'recovery': { 'orangefox': 'https://github.com/ozyern/ReVork/releases/download/downloads/orangefox_8series.img', 'twrp': 'https://github.com/ozyern/ReVork/releases/download/downloads/twrp_8p.img' }
            },
            'op8t': { 
                'super_empty': { default: 'https://github.com/ozyern/ReVork/releases/download/downloads/super_empty_8t.img' }, 
                'recovery': { 'orangefox': 'https://github.com/ozyern/ReVork/releases/download/downloads/orangefox_8series.img', 'twrp': 'https://github.com/ozyern/ReVork/releases/download/downloads/twrp_8t.img' }
            }
        };

        btnExec.addEventListener('click', () => {
            if (!state.device) return typeCommand("Error: Missing --hardware parameter", "term-glow-red");
            if (!state.component) return typeCommand("Error: Missing --format parameter", "term-glow-red");
            if (state.component === 'recovery' && !state.variant) return typeCommand("Error: Missing --variant parameter", "term-glow-red");

            const url = fileDatabase[state.device]?.[state.component]?.[state.variant];
            if (url) {
                btnExec.classList.remove('is-ready');
                glowWrapper.classList.remove('is-ready');
                typeCommand(`wget -qO- fetching_payload...`, "term-glow-yellow");
                
                setTimeout(() => {
                    typeCommand(`200 OK: Payload found. Redirecting.`, "term-glow-green");
                    setTimeout(() => window.location.href = url, 400); 
                }, 600);
            } else {
                typeCommand("Error 404: Payload not found in remote repository.", "term-glow-red");
            }
        });
    </script>
</body>
</html>
